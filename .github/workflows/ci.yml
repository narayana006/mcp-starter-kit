name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    name: TypeScript template (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: templates/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: templates/typescript/package-lock.json
      - run: npm ci
      # Type-checks, builds dist/ and runs unit plus stdio end-to-end tests.
      - run: npm test
      - name: Run the example client against the built server
        run: node examples/client.mjs

  python:
    name: Python template (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: templates/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v
      - name: Run the example client against the installed server
        run: python examples/client.py
